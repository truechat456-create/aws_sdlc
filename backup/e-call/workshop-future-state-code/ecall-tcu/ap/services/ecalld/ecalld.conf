# ecalld configuration (baseline v1). "key = value", # for comments.
# All values optional; built-in defaults are applied first.

# GNSS NMEA listener (UDP)
gnss_port = 10110

# Manual SOS listener (UDP)
sos_port = 10111

# SocketCAN interface carrying the crash/airbag frame (ID 0x0A0)
can_ifname = vcan0

# PSAP destination for the MSD
psap_host = 127.0.0.1
psap_port = 5000

# Vehicle identity and defaults (synthetic data only)
vin = SYNTHVIN000000001
passengers = 1

# Mark outgoing MSDs as test calls (1/true) or real (0/false)
test_call = 0
